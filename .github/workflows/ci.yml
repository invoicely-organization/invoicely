# CI of the product (INV-64, INV-65): types, lint and tests on every PR and on main, and a secret scan.
# Agents cannot change workflows (the bot has no Workflows permission and the role guard locks .github/), so this file
# is the contract the code must meet: Node 22, pnpm 10, a pnpm-lock.yaml, and the root scripts typecheck, lint and test.
# Until the skeleton (package.json) is in, only the secret scan does anything.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: types, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Is the app there yet?
        id: app
        run: |
          if [ -f package.json ]; then echo "present=yes" >> "$GITHUB_OUTPUT"; else echo "present=no" >> "$GITHUB_OUTPUT"; echo "No package.json yet: nothing to check."; fi
      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'yes'
        with:
          node-version: 22
      - name: Install pnpm and the dependencies
        if: steps.app.outputs.present == 'yes'
        run: |
          npm install -g pnpm@10
          pnpm install --frozen-lockfile
      - name: Types
        if: steps.app.outputs.present == 'yes'
        run: pnpm typecheck
      - name: Lint
        if: steps.app.outputs.present == 'yes'
        run: pnpm lint
      - name: Tests
        if: steps.app.outputs.present == 'yes'
        run: pnpm test

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks version
      - name: Scan the whole history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
